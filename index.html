<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitty PVP Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-feature-settings:"cv01","ss03"}
:root{--bg:#08090a;--panel:#0f1011;--surface:#191a1b;--elevated:#28282c;
--text:#f7f8f8;--text2:#d0d6e0;--text3:#8a8f98;--text4:#62666d;
--accent:#7170ff;--accent-bg:#5e6ad2;--accent-hover:#828fff;
--green:#27a644;--emerald:#10b981;--red:#f87171;
--border:rgba(255,255,255,.08);--border-subtle:rgba(255,255,255,.05);
--radius:8px;--radius-lg:12px}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.container{max-width:1280px;margin:0 auto;padding:0 24px}
.header{border-bottom:1px solid var(--border-subtle);background:rgba(8,9,10,.85);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 0;flex-wrap:wrap;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text)}
.logo-icon{width:28px;height:28px;background:linear-gradient(135deg,var(--accent-bg),var(--accent-hover));border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px}
.header-meta{font-size:13px;color:var(--text3);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.live-dot{display:inline-block;width:6px;height:6px;background:var(--emerald);border-radius:50%;margin-right:6px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.version-bar{display:flex;gap:8px;margin:32px 0 40px;flex-wrap:wrap}
.version-pill{padding:10px 18px;border-radius:9999px;border:1px solid var(--border);background:rgba(255,255,255,.02);font-size:13px;color:var(--text3);display:flex;align-items:center;gap:8px;transition:all .15s}
.version-pill .v-tag{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--accent);font-size:12px;padding:2px 8px;border-radius:4px;background:rgba(113,112,255,.1);border:1px solid rgba(113,112,255,.2)}
.version-pill .v-count{font-family:'JetBrains Mono',monospace;color:var(--text);font-weight:500}
.collection-section{margin-bottom:48px}
.collection-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border-subtle);flex-wrap:wrap;gap:8px}
.collection-title{font-size:20px;font-weight:590;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
.collection-title a{color:var(--text);text-decoration:none}
.collection-title a:hover{color:var(--accent-hover)}
.v-badge{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--accent);padding:3px 10px;border-radius:6px;background:rgba(113,112,255,.1);border:1px solid rgba(113,112,255,.2)}
.collection-badge{font-size:11px;color:var(--text3);padding:2px 8px;border:1px solid var(--border);border-radius:9999px;background:rgba(255,255,255,.03)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.metric-card{background:rgba(255,255,255,.02);border:1px solid var(--border-subtle);border-radius:var(--radius);padding:18px 20px}
.metric-label{font-size:11px;font-weight:500;color:var(--text4);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.metric-value{font-size:24px;font-weight:500;color:var(--text);letter-spacing:-.02em;font-family:'JetBrains Mono',monospace;margin-bottom:6px}
.metric-sub{font-size:12px;color:var(--text3);display:flex;gap:12px;flex-wrap:wrap}
.metric-sub span{display:flex;align-items:center;gap:4px}
.delta-up{color:var(--emerald)}.delta-down{color:var(--red)}
.whales-section{background:rgba(255,255,255,.02);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden}
.whales-header{padding:16px 20px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.whales-title{font-size:14px;font-weight:590;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.whales-note{font-size:12px;color:var(--text3)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;padding:10px 20px;font-size:11px;font-weight:500;color:var(--text4);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border-subtle);background:rgba(255,255,255,.01);white-space:nowrap}
.table td{padding:12px 20px;border-bottom:1px solid var(--border-subtle);color:var(--text2)}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:rgba(255,255,255,.02)}
.addr-cell{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text)}
.addr-cell a{color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.addr-cell a:hover{color:var(--accent-hover)}
.contract-tag{font-size:10px;padding:1px 6px;background:rgba(113,112,255,.1);color:var(--accent);border-radius:4px;border:1px solid rgba(113,112,255,.2)}
.num-cell{font-family:'JetBrains Mono',monospace;text-align:right;color:var(--text)}
.footer{border-top:1px solid var(--border-subtle);padding:24px 0 48px;margin-top:48px;font-size:12px;color:var(--text4);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.footer a{color:var(--text3);text-decoration:none}
.footer a:hover{color:var(--text2)}
.loading{display:flex;justify-content:center;align-items:center;min-height:60vh;gap:12px;color:var(--text3);font-size:14px}
.loading-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:pulse 1s ease-in-out infinite}
.error{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:60vh;gap:12px;color:var(--text3)}
.error h2{color:var(--text);font-size:18px;font-weight:590}
@media(max-width:768px){.container{padding:0 16px}.card-grid{grid-template-columns:repeat(2,1fr)}.table{font-size:12px}.table th,.table td{padding:8px 12px}.header-meta{font-size:11px}}
@media(max-width:480px){.card-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="app"><div class="loading"><div class="loading-dot"></div>Загрузка данных…</div></div>

<script>
const fmtUsd = n => n>=1e6?`$${(n/1e6).toFixed(2)}M`:n>=1e3?`$${(n/1e3).toFixed(1)}K`:`$${n.toFixed(2)}`;
const fmtEth = n => n>=1000?`${n.toFixed(0)}`:n>=1?`${n.toFixed(2)}`:`${n.toFixed(3)}`;
const fmtNum = n => n>=1e6?`${(n/1e6).toFixed(1)}M`:n>=1e3?`${(n/1e3).toFixed(1)}K`:n.toLocaleString('en-US');
const short = a => `<span>${a.slice(0,6)}</span><span style="color:var(--text4)">…</span><span>${a.slice(-4)}</span>`;

async function main() {
  let d;
  try {
    const r = await fetch('data.json');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    d = await r.json();
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="error"><h2>Не удалось загрузить данные</h2><p>${e.message}</p></div>`;
    return;
  }

  const cols = d.collections;
  if (!cols || cols.length === 0) {
    document.getElementById('app').innerHTML = '<div class="error"><h2>Недостаточно данных</h2></div>';
    return;
  }

  const dt = new Date(d.generatedAt);
  const updated = dt.toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

  let html = `
<div class="header"><div class="container header-inner">
  <div class="logo"><span class="logo-icon">🐱</span>Kitty PVP Dashboard</div>
  <div class="header-meta">
    <span><span class="live-dot"></span>обновлено ${updated} МСК</span>
    <span>·</span><span>ETH ≈ ${fmtUsd(d.ethPriceUsd)}</span>
    <span>·</span><span>⬡ Robinhood chain</span>
  </div>
</div></div>

<main class="container" style="padding-top:32px">
  <div class="version-bar">
    ${cols.map(c => `<div class="version-pill"><span class="v-tag">${c.version}</span> <span>${c.name}</span> <span class="v-count">${fmtNum(c.unique_holders)} holders</span></div>`).join('')}
  </div>
`;

  for (const c of cols) {
    const floorUsd = c.stats.floorPrice * d.ethPriceUsd;
    const listedPct = c.total_supply ? (c.listings.count/c.total_supply*100) : 0;
    const oneDay = (c.stats.intervals||[]).find(i=>i.interval==='one_day');
    const sevenDay = (c.stats.intervals||[]).find(i=>i.interval==='seven_day');
    const uniqPct = c.total_supply ? (c.unique_holders/c.total_supply*100).toFixed(1) : '0';

    html += `
<section class="collection-section">
  <div class="collection-header">
    <div class="collection-title">
      <span class="v-badge">${c.version}</span>
      <a href="${c.opensea_url}" target="_blank" rel="noopener">${c.name}</a>
      <span class="collection-badge mono">${c.slug}</span>
    </div>
    <div class="header-meta"><span>supply ${fmtNum(c.total_supply)}</span><span>·</span><span>${c.unique_holders} holders</span></div>
  </div>
  <div class="card-grid">
    <div class="metric-card"><div class="metric-label">Уникальные холдеры</div><div class="metric-value">${fmtNum(c.unique_holders)}</div><div class="metric-sub"><span>supply ${fmtNum(c.total_supply)}</span><span>·</span><span>${uniqPct}% уникальных</span></div></div>
    <div class="metric-card"><div class="metric-label">Флор коллекции</div><div class="metric-value">Ξ ${fmtEth(c.stats.floorPrice)}</div><div class="metric-sub"><span>≈ ${fmtUsd(floorUsd)}</span></div></div>
    <div class="metric-card"><div class="metric-label">Объём продаж (всего)</div><div class="metric-value">Ξ ${fmtEth(c.stats.volume)}</div><div class="metric-sub"><span>≈ ${fmtUsd(c.stats.volume*d.ethPriceUsd)}</span></div></div>
    <div class="metric-card"><div class="metric-label">Продажи (кол-во)</div><div class="metric-value">${fmtNum(c.stats.sales)}</div><div class="metric-sub">${oneDay?`<span class="delta-up">24ч: ${oneDay.sales}</span>`:''}${sevenDay?`<span>7д: ${sevenDay.sales}</span>`:''}</div></div>
    <div class="metric-card"><div class="metric-label">Листинги (активные)</div><div class="metric-value">${fmtNum(c.listings.count)}</div><div class="metric-sub"><span>${listedPct.toFixed(1)}% supply</span></div></div>
  </div>
  ${renderWhales(c)}
</section>`;
  }

  html += `
<footer class="footer"><div class="container" style="display:flex;justify-content:space-between;width:100%;flex-wrap:wrap;gap:12px">
  <span>Данные: OpenSea API v2 · Blockscout Robinhood · обновление каждые 6ч</span>
  <span><a href="https://github.com/manfromhellxbt/kitty-pvp-dashboard" target="_blank" rel="noopener">GitHub</a> · <a href="https://opensea.io/collection/robinhood-kitties" target="_blank" rel="noopener">OpenSea</a> · <a href="https://robinhoodchain.blockscout.com" target="_blank" rel="noopener">Blockscout</a></span>
</div></footer>`;

  document.getElementById('app').innerHTML = html;
}

function renderWhales(c) {
  if (!c.top_holders || c.top_holders.length === 0) return '';
  const rows = c.top_holders.map((h,i) => {
    const tv = h.totalValueUsd !== undefined ? fmtUsd(h.totalValueUsd) : '—';
    const cash = h.tokenValueUsd !== undefined ? fmtUsd(h.tokenValueUsd) : '—';
    const nftv = h.nftValueUsd !== undefined ? fmtUsd(h.nftValueUsd) : '—';
    return `<tr>
      <td style="color:var(--text4);font-family:'JetBrains Mono',monospace">${i+1}</td>
      <td class="addr-cell"><a href="https://robinhoodchain.blockscout.com/address/${h.address}" target="_blank" rel="noopener">${short(h.address)}${h.isContract?'<span class="contract-tag" style="margin-left:6px">contract</span>':''}</a></td>
      <td class="num-cell">${h.nftCount}</td>
      <td class="num-cell">${cash}</td>
      <td class="num-cell">${nftv}</td>
      <td class="num-cell" style="font-weight:500">${tv}</td>
    </tr>`;
  }).join('');
  return `
<div class="whales-section">
  <div class="whales-header"><div class="whales-title"><span class="v-badge" style="font-size:11px;padding:2px 6px">${c.version}</span>Топ холдеры (киты)</div><div class="whales-note">портфолио через OpenSea · chain: robinhood · топ-15</div></div>
  <div style="overflow-x:auto"><table class="table">
    <thead><tr><th>#</th><th>Адрес</th><th style="text-align:right">NFT</th><th style="text-align:right">Наличные ($)</th><th style="text-align:right">NFT ($)</th><th style="text-align:right">Всего ($)</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>
</div>`;
}

main();
</script>
</body>
</html>
